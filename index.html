
    const URL_API = "";

   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Expedientes - GEDE</title>
    <!-- Librería OCR Tesseract.js -->
    <script src="https://unpkg.com/tesseract.js@v5.1.0/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 680px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button, .btn-camara { background-color: #007bff; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 4px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 5px; text-align: center; display: block; text-decoration: none; box-sizing: border-box; }
        button:hover, .btn-camara:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; }
        .btn-success { background-color: #28a745; }
        .btn-secundario { background-color: #17a2b8; }
        .btn-warning { background-color: #ffc107; color: #333; }
        .card { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .alerta { background: #fff3cd; color: #856404; padding: 10px; border: 1px solid #ffeeba; border-radius: 4px; margin-bottom: 15px; }
        .oculto { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        table, th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- VISTA 1: LOGIN -->
    <div id="seccionLogin">
        <h2>🔐 Control de Acceso - Oficina GEDE</h2>
        <div class="form-group">
            <label>Seleccioná tu Agente:</label>
            <select id="loginAgente">
                <option value="">Seleccioná tu nombre...</option>
                <option value="Maxi">Maxi</option>
                <option value="Ceci">Ceci</option>
                <option value="Sofi">Sofi</option>
                <option value="Lore">Lore</option>
                <option value="Marce">Marce</option>
                <option value="Pao">Pao</option>
                <option value="Diego">Diego</option>
                <option value="Carlos">Carlos</option>
                <option value="Javi">Javi</option>
            </select>
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="loginPass" placeholder="Tu contraseña personal">
        </div>
        <button onclick="iniciarSesion()">🔑 Entrar</button>
        <button onclick="registrarPassword()" style="background-color: #6c757d; margin-top: 10px;">📝 Registrar Contraseña por 1ª vez</button>
        <p id="mensajeLogin" style="text-align:center; font-weight:bold; margin-top:15px;"></p>
    </div>

    <!-- VISTA 2: SELECCIÓN DE ROL / MENÚ PRINCIPAL -->
    <div id="seccionRol" class="oculto">
        <h2 id="saludoUsuario"></h2>
        <div id="avisoEmisor" class="alerta oculto"></div>
        <hr>
        <h3>Seleccioná tu modo de trabajo:</h3>
        <button onclick="elegirRol('emisor')" class="btn-success">📤 Ingresar como EMISOR</button>
        <button onclick="elegirRol('receptor')" style="margin-top: 15px;">📥 Ingresar como RECEPTOR</button>
        <button onclick="abrirModuloBusqueda()" class="btn-secundario" style="margin-top: 15px;">🔍 Buscar y Exportar Expedientes</button>
        <button onclick="cerrarSesion()" class="btn-danger" style="margin-top: 30px;">🔒 Cerrar Sesión</button>
    </div>

    <!-- VISTA 3: RECEPTOR -->
    <div id="seccionReceptor" class="oculto">
        <h2>📥 Panel de Agente Receptor</h2>
        <p>Expedientes asignados a: <b id="nombreReceptorVisual"></b></p>
        <div id="listaExpedientesReceptor">Cargando expedientes...</div>
        <button onclick="volverMenuRoles()" style="background-color: #6c757d; margin-top: 20px;">⬅️ Volver al Menú Principal</button>
    </div>

    <!-- VISTA 4: EMISOR -->
    <div id="seccionEmisor" class="oculto">
        <h2>📤 Panel de Agente Emisor</h2>
        
        <div class="form-group">
            <label>Número de Expediente:</label>
            <input type="text" id="nroExp" placeholder="Ej: 0060016-193687/2025-1">
            <label for="camaraBarra" class="btn-secundario">📷 Escanear Código de Barras</label>
            <input type="file" id="camaraBarra" accept="image/*" capture="environment" style="display:none;" onchange="escanearCodigoNativo(this)">
        </div>

        <!-- Carátula ampliada -->
        <div class="form-group">
            <label>Carátula (Extracto o Texto Completo):</label>
            <textarea id="caratula" rows="8" placeholder="Texto extraído de la carátula (puedes editarlo libremente si el OCR detecta ruido)..."></textarea>
            <label for="camaraOcr" class="btn-camara">📷 Extraer Carátula (OCR)</label>
            <input type="file" id="camaraOcr" accept="image/*" capture="environment" style="display:none;" onchange="procesarOcrCaratula(this)">
        </div>

        <!-- Localidad movida debajo de carátula con opción de agregar -->
        <div class="form-group">
            <label>Localidad:</label>
            <select id="selectLocalidad" onchange="verificarOtraLocalidad(this)">
                <option value="">Seleccioná una localidad...</option>
                <option value="Cachi">Cachi</option>
                <option value="Cafayate">Cafayate</option>
                <option value="Chicoana">Chicoana</option>
                <option value="Cnel. Moldes">Cnel. Moldes</option>
                <option value="El Carril">El Carril</option>
                <option value="Iruya">Iruya</option>
                <option value="La Caldera">La Caldera</option>
                <option value="La Calderilla">La Calderilla</option>
                <option value="Molinos">Molinos</option>
                <option value="Rosario de la Frontera">Rosario de la Frontera</option>
                <option value="Salta Capital">Salta Capital</option>
                <option value="San Antonio de los Cobres">San Antonio de los Cobres</option>
                <option value="San Carlos">San Carlos</option>
                <option value="San Lorenzo">San Lorenzo</option>
                <option value="Vaqueros">Vaqueros</option>
                <option value="OTRA">➕ Agregar otra localidad...</option>
            </select>
            <input type="text" id="otraLocalidadInput" class="oculto" placeholder="Escribí la nueva localidad..." style="margin-top: 5px;">
        </div>

        <div class="form-group">
            <label>Agente Receptor Asignado:</label>
            <select id="agenteReceptorAsignado">
                <option value="Maxi">Maxi</option>
                <option value="Ceci">Ceci</option>
                <option value="Sofi">Sofi</option>
                <option value="Lore">Lore</option>
                <option value="Marce">Marce</option>
                <option value="Pao">Pao</option>
                <option value="Diego">Diego</option>
                <option value="Carlos">Carlos</option>
                <option value="Javi">Javi</option>
            </select>
        </div>

        <div class="form-group">
            <label>📅 Fecha de Creación:</label>
            <input type="date" id="fechaCreacionExp">
        </div>

        <div class="form-group">
            <label>🚚 Fecha de Entrega:</label>
            <input type="date" id="fechaEntregaExp">
        </div>

        <button onclick="guardarExpediente()" class="btn-success">💾 Guardar y Enviar Expediente</button>
        <p id="mensajeEmisor" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
        <button onclick="volverMenuRoles()" style="background-color: #6c757d; margin-top: 20px;">⬅️ Volver al Menú Principal</button>
    </div>

    <!-- VISTA 5: BUSCADOR Y EXPORTADOR -->
    <div id="seccionBusqueda" class="oculto">
        <h2>🔍 Búsqueda y Exportación de Expedientes</h2>
        <div class="form-group">
            <label>Nro Expediente (Parcial/Total):</label>
            <input type="text" id="filtroNro" placeholder="Ej: 193687">
        </div>
        <div class="form-group">
            <label>Agente (Receptor o Emisor):</label>
            <input type="text" id="filtroAgente" placeholder="Ej: Maxi">
        </div>
        <div class="form-group">
            <label>Localidad:</label>
            <input type="text" id="filtroLocalidad" placeholder="Ej: Salta">
        </div>
        <div class="form-group">
            <label>Texto en Carátula:</label>
            <input type="text" id="filtroCaratulaText" placeholder="Palabra clave...">
        </div>
        <div class="form-group">
            <label>Desde Fecha:</label>
            <input type="date" id="filtroFechaDesde">
        </div>
        <div class="form-group">
            <label>Hasta Fecha:</label>
            <input type="date" id="filtroFechaHasta">
        </div>
        
        <button onclick="ejecutarBusqueda()" class="btn-secundario">🔎 Filtrar Resultados</button>
        <button onclick="exportarDatos('filtrado')" class="btn-success" style="margin-top: 10px;">📊 Exportar Filtrados (CSV/Excel)</button>
        <button onclick="exportarDatos('todo')" class="btn-warning" style="margin-top: 10px;">📂 Exportar Base Completa (CSV/Excel)</button>
        
        <div id="resultadoBusquedaContainer" style="margin-top: 20px; overflow-x: auto;"></div>
        
        <button onclick="volverMenuRoles()" style="background-color: #6c757d; margin-top: 20px;">⬅️ Volver al Menú Principal</button>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbyP1dr0fGe9oqHsLL0vDtuoDFF5Zkncn7I931PRUVR3-ffCWFLMrOeQ7bdz3n54nc3Etw/exec";

    let usuarioActual = "";
    let emisorActualGlobal = "";
    let cacheMovimientos = [];

    function establecerFechasPorDefecto() {
        let hoy = new Date().toISOString().split('T')[0];
        document.getElementById("fechaCreacionExp").value = hoy;
        document.getElementById("fechaEntregaExp").value = hoy;
    }

    function verificarOtraLocalidad(select) {
        let inputOtra = document.getElementById("otraLocalidadInput");
        if (select.value === "OTRA") {
            inputOtra.classList.remove("oculto");
            inputOtra.value = "";
            inputOtra.focus();
        } else {
            inputOtra.classList.add("oculto");
        }
    }

    function obtenerLocalidadSeleccionada() {
        let select = document.getElementById("selectLocalidad");
        if (select.value === "OTRA") {
            return document.getElementById("otraLocalidadInput").value.trim();
        }
        return select.value;
    }

    async function escanearCodigoNativo(input) {
        if (input.files && input.files[0]) {
            let archivo = input.files[0];
            let msgEmisor = document.getElementById("mensajeEmisor");
            msgEmisor.style.color = "#007bff";
            msgEmisor.innerText = "⏳ Leyendo código de barras...";

            try {
                if (!('BarcodeDetector' in window)) {
                    throw new Error("BarcodeDetector no soportado.");
                }
                const detector = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'pdf417', 'qr_code'] });
                let imagenBitmap = await createImageBitmap(archivo);
                let resultados = await detector.detect(imagenBitmap);

                if (resultados.length > 0) {
                    document.getElementById("nroExp").value = resultados[0].rawValue;
                    msgEmisor.style.color = "green";
                    msgEmisor.innerText = "✅ ¡Código detectado!";
                } else {
                    msgEmisor.style.color = "orange";
                    msgEmisor.innerText = "⚠️ No se detectó código. Acercá más la cámara.";
                }
            } catch (error) {
                msgEmisor.style.color = "red";
                msgEmisor.innerText = "❌ Navegador sin soporte nativo de barras.";
            }
        }
    }

    async function procesarOcrCaratula(input) {
        if (input.files && input.files[0]) {
            let archivo = input.files[0];
            let msgEmisor = document.getElementById("mensajeEmisor");
            msgEmisor.style.color = "#007bff";
            msgEmisor.innerText = "⏳ Extrayendo texto completo de la carátula...";

            try {
                let worker = await Tesseract.createWorker('spa');
                let resultado = await worker.recognize(archivo);
                await worker.terminate();

                let textoCompleto = resultado.data.text;
                // Dejamos el texto completo o con limpieza suave para que el usuario pueda visualizar toda la carátula con facilidad
                let textoLimpio = textoCompleto.replace(/[^\w\sáéíóúÁÉÍÓÚñÑüÜ.,\-\/]/gi, ' ').replace(/\s+/g, ' ').trim();
                
                document.getElementById("caratula").value = textoLimpio;
                msgEmisor.style.color = "green";
                msgEmisor.innerText = "✅ ¡Texto extraído! Revisalo en el recuadro ampliado.";

            } catch (error) {
                msgEmisor.style.color = "red";
                msgEmisor.innerText = "❌ Error al procesar el OCR.";
                console.error(error);
            }
        }
    }

    async function iniciarSesion() {
        const agente = document.getElementById("loginAgente").value;
        const pass = document.getElementById("loginPass").value;
        const msg = document.getElementById("mensajeLogin");

        if (!agente) { msg.style.color = "red"; msg.innerText = "⚠️ Seleccioná un agente."; return; }
        if (!pass) { msg.style.color = "red"; msg.innerText = "⚠️ Ingresá una contraseña."; return; }

        msg.style.color = "#333"; msg.innerText = "Verificando credenciales...";

        try {
            let respuesta = await fetch(URL_API + "?action=getDatosGlobales");
            let data = await respuesta.json();
            
            let usuariosRows = data.usuarios;
            let configRows = data.config;

            let encontrado = false;
            let passCorrecta = false;

            for (let i = 1; i < usuariosRows.length; i++) {
                let u = String(usuariosRows[i][0]).trim();
                let p = String(usuariosRows[i][1]).trim();
                if (u.toLowerCase() === agente.toLowerCase()) {
                    encontrado = true;
                    if (String(p) === String(pass)) passCorrecta = true;
                    break;
                }
            }

            if (!encontrado) { msg.style.color = "red"; msg.innerText = "❌ Usuario sin contraseña registrada."; return; }
            if (!passCorrecta) { msg.style.color = "red"; msg.innerText = "❌ Contraseña incorrecta."; return; }

            emisorActualGlobal = "";
            for(let i = 0; i < configRows.length; i++) {
                if(String(configRows[i][0]).trim().toLowerCase() === "emisor_activo") {
                    emisorActualGlobal = String(configRows[i][1]).trim();
                }
            }

            usuarioActual = agente;
            document.getElementById("saludoUsuario").innerText = `¡Hola, ${usuarioActual}!`;
            
            let aviso = document.getElementById("avisoEmisor");
            if(emisorActualGlobal && emisorActualGlobal !== "") {
                if(emisorActualGlobal.toLowerCase() !== usuarioActual.toLowerCase()) {
                    aviso.innerText = `⚠️ Aviso: El agente ${emisorActualGlobal} está configurado como Emisor actual.`;
                    aviso.classList.remove("oculto");
                } else {
                    aviso.innerText = `ℹ️ Estás registrado como el Emisor activo.`;
                    aviso.classList.remove("oculto");
                }
            } else {
                aviso.classList.add("oculto");
            }

            document.getElementById("seccionLogin").classList.add("oculto");
            document.getElementById("seccionRol").classList.remove("oculto");

        } catch (e) {
            msg.style.color = "red"; 
            msg.innerText = "❌ Error de conexión con Google Sheets.";
            console.error(e);
        }
    }

    async function registrarPassword() {
        const agente = document.getElementById("loginAgente").value;
        const pass = document.getElementById("loginPass").value;
        const msg = document.getElementById("mensajeLogin");

        if (!agente || !pass) { msg.style.color = "red"; msg.innerText = "⚠️ Seleccioná un agente y contraseña."; return; }

        let datos = { hoja: "Usuarios", action: "registrarPassword", usuario: agente, password: pass };
        await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(datos) });
        msg.style.color = "green"; msg.innerText = "✅ ¡Contraseña registrada con éxito!";
    }

    async function elegirRol(rol) {
        if (rol === "emisor") {
            // Validación de emisor ya existente (Punto 4)
            if (emisorActualGlobal && emisorActualGlobal !== "" && emisorActualGlobal.toLowerCase() !== usuarioActual.toLowerCase()) {
                let confirmar = confirm(`Ya existe un agente emisor activo (${emisorActualGlobal}), ¿está seguro de asumir este rol?`);
                if (!confirmar) return;
            }

            await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ hoja: "config", action: "updateEmisor", emisor: usuarioActual }) });
            document.getElementById("seccionRol").classList.add("oculto");
            document.getElementById("seccionEmisor").classList.remove("oculto");
            establecerFechasPorDefecto();
        } else {
            document.getElementById("seccionRol").classList.add("oculto");
            document.getElementById("seccionReceptor").classList.remove("oculto");
            document.getElementById("nombreReceptorVisual").innerText = usuarioActual;
            cargarExpedientesReceptor();
        }
    }

    async function abrirModuloBusqueda() {
        document.getElementById("seccionRol").classList.add("oculto");
        document.getElementById("seccionBusqueda").classList.remove("oculto");
        await precargarMovimientos();
    }

    async function precargarMovimientos() {
        let contenedor = document.getElementById("resultadoBusquedaContainer");
        contenedor.innerHTML = "Cargando datos para búsqueda...";
        try {
            let respuesta = await fetch(URL_API + "?action=getMovimientos");
            cacheMovimientos = await respuesta.json();
            contenedor.innerHTML = "<p><i>Datos cargados. Ingrese filtros y presione 'Filtrar Resultados'.</i></p>";
        } catch (e) {
            contenedor.innerHTML = "<p style='color:red;'>Error al cargar los movimientos.</p>";
        }
    }

    function ejecutarBusqueda() {
        let fNro = document.getElementById("filtroNro").value.toLowerCase();
        let fAgente = document.getElementById("filtroAgente").value.toLowerCase();
        let fLoc = document.getElementById("filtroLocalidad").value.toLowerCase();
        let fCaratula = document.getElementById("filtroCaratulaText").value.toLowerCase();
        let fDesde = document.getElementById("filtroFechaDesde").value;
        let fHasta = document.getElementById("filtroFechaHasta").value;

        let html = "<table><tr><th>Nro Exp</th><th>Localidad</th><th>Receptor</th><th>Carátula</th><th>Creación</th><th>Estado</th></tr>";
        let contador = 0;

        for (let i = 1; i < cacheMovimientos.length; i++) {
            let f = cacheMovimientos[i];
            let nroExp = f.length > 1 ? String(f[1]) : "";
            let localidad = f.length > 3 ? String(f[3]) : "";
            let receptor = f.length > 4 ? String(f[4]) : "";
            let caratula = f.length > 5 ? String(f[5]) : "";
            let fechaCreacion = f.length > 6 ? String(f[6]) : "";
            let emisor = f.length > 8 ? String(f[8]) : "";
            let estado = f.length > 9 ? String(f[9]) : "";

            // Filtros
            if (fNro && !nroExp.toLowerCase().includes(fNro)) continue;
            if (fAgente && !receptor.toLowerCase().includes(fAgente) && !emisor.toLowerCase().includes(fAgente)) continue;
            if (fLoc && !localidad.toLowerCase().includes(fLoc)) continue;
            if (fCaratula && !caratula.toLowerCase().includes(fCaratula)) continue;
            if (fDesde && fechaCreacion < fDesde) continue;
            if (fHasta && fechaCreacion > fHasta) continue;

            contador++;
            html += `<tr>
                <td>${nroExp}</td>
                <td>${localidad}</td>
                <td>${receptor}</td>
                <td>${caratula}</td>
                <td>${fechaCreacion}</td>
                <td>${estado}</td>
            </tr>`;
        }

        html += "</table>";
        document.getElementById("resultadoBusquedaContainer").innerHTML = `<b>Se encontraron ${contador} registros:</b>` + html;
    }

    function exportarDatos(tipo) {
        if (!cacheMovimientos || cacheMovimientos.length === 0) {
            alert("No hay datos cargados para exportar.");
            return;
        }

        let filasExportar = [];
        filasExportar.push(cacheMovimientos[0]); // Cabecera

        if (tipo === "todo") {
            for (let i = 1; i < cacheMovimientos.length; i++) {
                filasExportar.push(cacheMovimientos[i]);
            }
        } else {
            // Filtrados según los campos actuales
            let fNro = document.getElementById("filtroNro").value.toLowerCase();
            let fAgente = document.getElementById("filtroAgente").value.toLowerCase();
            let fLoc = document.getElementById("filtroLocalidad").value.toLowerCase();
            let fCaratula = document.getElementById("filtroCaratulaText").value.toLowerCase();
            let fDesde = document.getElementById("filtroFechaDesde").value;
            let fHasta = document.getElementById("filtroFechaHasta").value;

            for (let i = 1; i < cacheMovimientos.length; i++) {
                let f = cacheMovimientos[i];
                let nroExp = f.length > 1 ? String(f[1]) : "";
                let localidad = f.length > 3 ? String(f[3]) : "";
                let receptor = f.length > 4 ? String(f[4]) : "";
                let caratula = f.length > 5 ? String(f[5]) : "";
                let fechaCreacion = f.length > 6 ? String(f[6]) : "";
                let emisor = f.length > 8 ? String(f[8]) : "";

                if (fNro && !nroExp.toLowerCase().includes(fNro)) continue;
                if (fAgente && !receptor.toLowerCase().includes(fAgente) && !emisor.toLowerCase().includes(fAgente)) continue;
                if (fLoc && !localidad.toLowerCase().includes(fLoc)) continue;
                if (fCaratula && !caratula.toLowerCase().includes(fCaratula)) continue;
                if (fDesde && fechaCreacion < fDesde) continue;
                if (fHasta && fechaCreacion > fHasta) continue;

                filasExportar.push(f);
            }
        }

        // Convertir a CSV compatible con Excel (separado por punto y coma ;)
        let csvContent = "\uFEFF"; // BOM para acentos en Excel
        filasExportar.forEach(fila => {
            let filaStr = fila.map(val => `"${String(val).replace(/"/g, '""')}"`).join(";");
            csvContent += filaStr + "\r\n";
        });

        let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        let url = URL.createObjectURL(blob);
        let link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Expedientes_GEDE_${tipo}_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    async function volverMenuRoles() {
        await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ hoja: "config", action: "updateEmisor", emisor: "" }) });
        
        document.getElementById("seccionEmisor").classList.add("oculto");
        document.getElementById("seccionReceptor").classList.add("oculto");
        document.getElementById("seccionBusqueda").classList.add("oculto");
        document.getElementById("seccionRol").classList.remove("oculto");
    }

    async function cerrarSesion() {
        await volverMenuRoles();
        usuarioActual = "";
        document.getElementById("loginPass").value = "";
        document.getElementById("mensajeLogin").innerText = "";
        document.getElementById("seccionRol").classList.add("oculto");
        document.getElementById("seccionLogin").classList.remove("oculto");
    }

    async function guardarExpediente() {
        const nro = document.getElementById("nroExp").value;
        const loc = obtenerLocalidadSeleccionada();
        const receptor = document.getElementById("agenteReceptorAsignado").value;
        const caratula = document.getElementById("caratula").value;
        const fechaCreacion = document.getElementById("fechaCreacionExp").value;
        const fechaEntrega = document.getElementById("fechaEntregaExp").value;
        const msg = document.getElementById("mensajeEmisor");

        if(!nro) { msg.style.color = "red"; msg.innerText = "⚠️ El número de expediente es obligatorio."; return; }
        if(!loc) { msg.style.color = "red"; msg.innerText = "⚠️ Debe seleccionar o ingresar una localidad."; return; }

        let nuevaFila = [Math.floor(Math.random() * 100000), nro, "General", loc, receptor, caratula, fechaCreacion, fechaEntrega, usuarioActual, "sin recibir", "", ""];

        msg.style.color = "#333"; msg.innerText = "Guardando...";
        await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ hoja: "movimientos", action: "append", valores: nuevaFila }) });
        
        msg.style.color = "green"; msg.innerText = "✅ ¡Expediente guardado con éxito!";
        document.getElementById("nroExp").value = "";
        document.getElementById("caratula").value = "";
        document.getElementById("selectLocalidad").value = "";
        document.getElementById("otraLocalidadInput").classList.add("oculto");
        establecerFechasPorDefecto();
    }

    async function cargarExpedientesReceptor() {
        const contenedor = document.getElementById("listaExpedientesReceptor");
        contenedor.innerHTML = "Buscando expedientes...";

        let respuesta = await fetch(URL_API + "?action=getMovimientos");
        let filas = await respuesta.json();

        let html = "";
        let encontrados = false;

        for (let i = 1; i < filas.length; i++) {
            let f = filas[i];
            let id = f[0];
            let nroExp = f.length > 1 ? f[1] : "";
            let localidad = f.length > 3 ? f[3] : "";
            let agenteReceptor = f.length > 4 ? String(f[4]).trim().toLowerCase() : "";
            let caratula = f.length > 5 ? f[5] : "";
            let fechaCreacion = f.length > 6 ? f[6] : "";
            let fechaEntrega = f.length > 7 ? f[7] : "";
            let estado = f.length > 9 ? String(f[9]).trim().toLowerCase() : "";

            if (agenteReceptor === usuarioActual.toLowerCase() && estado === "sin recibir") {
                encontrados = true;
                html += `
                    <div class="card">
                        <b>Nro Exp:</b> ${nroExp} <br>
                        <b>Localidad:</b> ${localidad} <br>
                        <b>Carátula:</b> ${caratula} <br>
                        <b>Fecha Creación:</b> ${fechaCreacion} <br>
                        <b>Fecha Entrega:</b> ${fechaEntrega} <br><br>
                        <button onclick="marcarRecibido('${id}')" class="btn-success">📥 Marcar Recibido</button>
                    </div>
                `;
            }
        }

        if (!encontrados) {
            contenedor.innerHTML = "<p>🎉 ¡No tenés expedientes pendientes de recepción!</p>";
        } else {
            contenedor.innerHTML = html;
        }
    }

    async function marcarRecibido(idExp) {
        await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ hoja: "movimientos", action: "marcarRecibido", id: idExp }) });
        alert("¡Expediente marcado como recibido!");
        cargarExpedientesReceptor();
    }
</script>
