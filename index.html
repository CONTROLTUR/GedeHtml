<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Expedientes - GEDE</title>
    <!-- Librería OCR Tesseract.js -->
    <script src="https://unpkg.com/tesseract.js@v5.1.0/dist/tesseract.min.js"></script>
    <!-- Librería QuaggaJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button, .btn-camara { background-color: #007bff; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 4px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 5px; text-align: center; display: block; text-decoration: none; box-sizing: border-box; }
        button:hover, .btn-camara:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; }
        .btn-success { background-color: #28a745; }
        .btn-secundario { background-color: #17a2b8; }
        .card { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .alerta { background: #fff3cd; color: #856404; padding: 10px; border: 1px solid #ffeeba; border-radius: 4px; margin-bottom: 15px; }
        .oculto { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- VISTA 1: LOGIN -->
    <div id="seccionLogin">
        <h2>🔐 Control de Acceso - Oficina GEDE</h2>
        <div class="form-group">
            <label>Seleccioná tu Agente:</label>
            <select id="loginAgente">
                <option value="">Seleccioná tu nombre...</option>
                <option value="Maxi">Maxi</option>
                <option value="Ceci">Ceci</option>
                <option value="Sofi">Sofi</option>
                <option value="Lore">Lore</option>
                <option value="Marce">Marce</option>
                <option value="Pao">Pao</option>
                <option value="Diego">Diego</option>
                <option value="Carlos">Carlos</option>
                <option value="Javi">Javi</option>
            </select>
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="loginPass" placeholder="Tu contraseña personal">
        </div>
        <button onclick="iniciarSesion()">🔑 Entrar</button>
        <button onclick="registrarPassword()" style="background-color: #6c757d; margin-top: 10px;">📝 Registrar Contraseña por 1ª vez</button>
        <p id="mensajeLogin" style="text-align:center; font-weight:bold; margin-top:15px;"></p>
    </div>

    <!-- VISTA 2: SELECCIÓN DE ROL -->
    <div id="seccionRol" class="oculto">
        <h2 id="saludoUsuario"></h2>
        <div id="avisoEmisor" class="alerta oculto"></div>
        <hr>
        <h3>Seleccioná tu modo de trabajo:</h3>
        <button onclick="elegirRol('emisor')" class="btn-success">📤 Ingresar como EMISOR</button>
        <button onclick="elegirRol('receptor')" style="margin-top: 15px;">📥 Ingresar como RECEPTOR</button>
        <button onclick="cerrarSesion()" class="btn-danger" style="margin-top: 30px;">🔒 Cerrar Sesión</button>
    </div>

    <!-- VISTA 3: RECEPTOR -->
    <div id="seccionReceptor" class="oculto">
        <h2>📥 Panel de Agente Receptor</h2>
        <p>Expedientes asignados a: <b id="nombreReceptorVisual"></b></p>
        <div id="listaExpedientesReceptor">Cargando expedientes...</div>
        <button onclick="volverMenuRoles()" style="background-color: #6c757d; margin-top: 20px;">⬅️ Volver al Menú Principal</button>
    </div>

    <!-- VISTA 4: EMISOR -->
    <div id="seccionEmisor" class="oculto">
        <h2>📤 Panel de Agente Emisor</h2>
        
        <!-- Número de Expediente (Código de barras o texto inferior) -->
        <div class="form-group">
            <label>Número de Expediente:</label>
            <input type="text" id="nroExp" placeholder="Ej: 0060016-193687/2025-1">
            <label for="camaraBarra" class="btn-secundario">📷 Sacar Foto al Código / Nro de Expediente</label>
            <input type="file" id="camaraBarra" accept="image/*" capture="environment" style="display:none;" onchange="procesarFotoBarra(this)">
        </div>

        <div class="form-group">
            <label>Localidad:</label>
            <input type="text" id="localidad" placeholder="Ej: Salta">
        </div>

        <div class="form-group">
            <label>Agente Receptor Asignado:</label>
            <select id="agenteReceptorAsignado">
                <option value="Maxi">Maxi</option>
                <option value="Ceci">Ceci</option>
                <option value="Sofi">Sofi</option>
                <option value="Lore">Lore</option>
                <option value="Marce">Marce</option>
                <option value="Pao">Pao</option>
                <option value="Diego">Diego</option>
                <option value="Carlos">Carlos</option>
                <option value="Javi">Javi</option>
            </select>
        </div>

        <!-- Carátula con OCR estricto en Español -->
        <div class="form-group">
            <label>Carátula (Extracto entre líneas):</label>
            <textarea id="caratula" rows="6" placeholder="Texto extraído de la carátula..."></textarea>
            <label for="camaraOcr" class="btn-camara">📷 Sacar Foto a la Carátula (OCR)</label>
            <input type="file" id="camaraOcr" accept="image/*" capture="environment" style="display:none;" onchange="procesarFotoOcr(this)">
        </div>

        <div class="form-group">
            <label>📅 Fecha de Creación:</label>
            <input type="date" id="fechaCreacionExp">
        </div>

        <div class="form-group">
            <label>🚚 Fecha de Entrega:</label>
            <input type="date" id="fechaEntregaExp">
        </div>

        <button onclick="guardarExpediente()" class="btn-success">💾 Guardar y Enviar Expediente</button>
        <p id="mensajeEmisor" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
        <button onclick="volverMenuRoles()" style="background-color: #6c757d; margin-top: 20px;">⬅️ Volver al Menú Principal</button>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbzI_2jGhlx--U9qdxqnfsmfGbAvJmI1mU5n5roSqH6O4LAKlDRn2jyVIKPTaJ9OEVcs/exec";
    let usuarioActual = "";
    let emisorActualGlobal = "";

    function establecerFechasPorDefecto() {
        let hoy = new Date().toISOString().split('T')[0];
        document.getElementById("fechaCreacionExp").value = hoy;
        document.getElementById("fechaEntregaExp").value = hoy;
    }

    // Procesar foto de código de barras / número de expediente inferior
    function procesarFotoBarra(input) {
        if (input.files && input.files[0]) {
            let archivo = input.files[0];
            let lectorUrl = URL.createObjectURL(archivo);
            let msgEmisor = document.getElementById("mensajeEmisor");
            msgEmisor.style.color = "#007bff";
            msgEmisor.innerText = "⏳ Leyendo código de expediente...";

            // Intento 1: Leer código de barras físico
            Quagga.decodeSingle({
                decoder: { readers: ["code_128_reader", "ean_reader", "code_39_reader"] },
                locate: true,
                src: lectorUrl
            }, function(result) {
                if (result && result.codeResult) {
                    document.getElementById("nroExp").value = result.codeResult.code;
                    msgEmisor.style.color = "green";
                    msgEmisor.innerText = "✅ ¡Código de barras detectado!";
                } else {
                    // Intento 2 (Plan B automático): Si no es código de barras, lee el texto numérico con OCR específico para el formato GEDE
                    Tesseract.recognize(archivo, 'eng', { logger: m => {} }).then(({ data: { text } }) => {
                        let regexExp = /\d{7}-\d{6}\/\d{4}-\d/;
                        let match = text.match(regexExp);
                        if (match) {
                            document.getElementById("nroExp").value = match[0];
                            msgEmisor.style.color = "green";
                            msgEmisor.innerText = "✅ ¡Número de expediente extraído!";
                        } else {
                            // Limpieza general de números largos si encuentra algo similar
                            let numerosLimpios = text.replace(/[^\d\-\/]/g, '');
                            if(numerosLimpios.length > 10) {
                                document.getElementById("nroExp").value = numerosLimpios.substring(0, 25);
                                msgEmisor.style.color = "orange";
                                msgEmisor.innerText = "⚠️ Verificá el número detectado.";
                            } else {
                                msgEmisor.style.color = "red";
                                msgEmisor.innerText = "❌ No se pudo leer automáticamente. Ingresalo manualmente.";
                            }
                        }
                    });
                }
            });
        }
    }

    // OCR estricto en Español para la Carátula
    async function procesarFotoOcr(input) {
        if (input.files && input.files[0]) {
            let archivo = input.files[0];
            let msgEmisor = document.getElementById("mensajeEmisor");
            msgEmisor.style.color = "#007bff";
            msgEmisor.innerText = "⏳ Procesando carátula en español (Aguardá unos segundos)...";

            try {
                let worker = await Tesseract.createWorker('spa');
                let resultado = await worker.recognize(archivo);
                await worker.terminate();

                let textoCompleto = resultado.data.text;
                let lineas = textoCompleto.split('\n');
                let textoCaratula = "";
                let capturando = false;

                for (let i = 0; i < lineas.length; i++) {
                    let lineaActual = lineas[i].trim();
                    let lineaUpper = lineaActual.toUpperCase();

                    if (lineaUpper.includes("CARATULA") || lineaUpper.includes("EXTRACTO")) {
                        capturando = true;
                        continue;
                    }

                    if (capturando && (lineaUpper.includes("SICE") || lineaUpper.includes("IMPR") || lineaUpper.includes("COD.") || lineaUpper.includes("USR."))) {
                        break;
                    }

                    if (capturando && lineaActual !== "") {
                        textoCaratula += lineaActual + " ";
                    }
                }

                // Si no encontró las etiquetas exactas, limpia todo el texto útil en español
                if (!textoCaratula.trim()) {
                    textoCaratula = textoCompleto;
                }

                // Limpieza profunda de caracteres extraños ASCII
                let textoLimpio = textoCaratula.replace(/[^\w\sáéíóúÁÉÍÓÚñÑüÜ.,\-\/]/gi, ' ').replace(/\s+/g, ' ').trim();
                document.getElementById("caratula").value = textoLimpio;

                // Extraer fecha del documento si aparece
                let regexFecha = /(\d{2}[-\/]\d{2}[-\/]\d{4})|(\d{4}[-\/]\d{2}[-\/]\d{2})/;
                let coincidencia = textoCompleto.match(regexFecha);
                
                if (coincidencia) {
                    let fechaStr = coincidencia[0].replace(/\//g, '-');
                    if (fechaStr.indexOf('-') === 2) {
                        let partes = fechaStr.split('-');
                        fechaStr = `${partes[2]}-${partes[1]}-${partes[0]}`;
                    }
                    document.getElementById("fechaCreacionExp").value = fechaStr;
                }

                msgEmisor.style.color = "green";
                msgEmisor.innerText = "✅ ¡Carátula leída con éxito!";

            } catch (error) {
                msgEmisor.style.color = "red";
                msgEmisor.innerText = "❌ Error al procesar el OCR.";
                console.error(error);
            }
        }
    }

    async function iniciarSesion() {
        const agente = document.getElementById("loginAgente").value;
        const pass = document.getElementById("loginPass").value;
        const msg = document.getElementById("mensajeLogin");

        if (!agente) { msg.style.color = "red"; msg.innerText = "⚠️ Seleccioná un agente."; return; }
        if (!pass) { msg.style.color = "red"; msg.innerText = "⚠️ Ingresá una contraseña."; return; }

        msg.style.color = "#333"; msg.innerText = "Verificando credenciales...";

        try {
            let respuesta = await fetch(URL_API + "?action=getDatosGlobales");
            let data = await respuesta.json();
            
            let usuariosRows = data.usuarios;
            let configRows = data.config;

            let encontrado = false;
            let passCorrecta = false;

            for (let i = 1; i < usuariosRows.length; i++) {
                let u = String(usuariosRows[i][0]).trim();
                let p = String(usuariosRows[i][1]).trim();
                if (u.toLowerCase() === agente.toLowerCase()) {
                    encontrado = true;
                    if (p === pass) passCorrecta = true;
                    break;
                }
            }

            if (!encontrado) { msg.style.color = "red"; msg.innerText = "❌ Usuario sin contraseña registrada."; return; }
            if (!passCorrecta) { msg.style.color = "red"; msg.innerText = "❌ Contraseña incorrecta."; return; }

            emisorActualGlobal = "";
            for(let i = 0; i < configRows.length; i++) {
                if(String(configRows[i][0]).trim().toLowerCase() === "emisor_activo") {
                    emisorActualGlobal = String(configRows[i][1]).trim();
                }
            }

            usuarioActual = agente;
            document.getElementById("saludoUsuario").innerText = `¡Hola, ${usuarioActual}!`;
            
            let aviso = document.getElementById("avisoEmisor");
            if(emisorActualGlobal && emisorActualGlobal !== "") {
                if(emisorActualGlobal.toLowerCase() !== usuarioActual.toLowerCase()) {
                    aviso.innerText = `⚠️ Aviso: El agente ${emisorActualGlobal} está como Emisor.`;
                    aviso.classList.remove("oculto");
                } else {
                    aviso.innerText = `ℹ️ Estás registrado como el Emisor activo.`;
                    aviso.classList.remove("oculto");
                }
            } else {
                aviso.classList.add("oculto");
            }

            document.getElementById("seccionLogin").classList.add("oculto");
            document.getElementById("seccionRol").classList.remove("oculto");

        } catch (e) {
            msg.style.color = "red"; 
            msg.innerText = "❌ Error de conexión con Google Sheets.";
        }
    }

    async function registrarPassword() {
        const agente = document.getElementById("loginAgente").value;
        const pass = document.getElementById("loginPass").value;
        const msg = document.getElementById("mensajeLogin");

        if (!agente || !pass) { msg.style.color = "red"; msg.innerText = "⚠️ Seleccioná un agente y contraseña."; return; }

        let datos = { hoja: "Usuarios", action: "registrarPassword", usuario: agente, password: pass };
        await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) });
        msg.style.color = "green"; msg.innerText = "✅ ¡Contraseña registrada con éxito!";
    }

    async function elegirRol(rol) {
        if (rol === "emisor") {
            await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hoja: "config", action: "updateEmisor", emisor: usuarioActual }) });
            document.getElementById("seccionRol").classList.add("oculto");
            document.getElementById("seccionEmisor").classList.remove("oculto");
            establecerFechasPorDefecto();
        } else {
            document.getElementById("seccionRol").classList.add("oculto");
            document.getElementById("seccionReceptor").classList.remove("oculto");
            document.getElementById("nombreReceptorVisual").innerText = usuarioActual;
            cargarExpedientesReceptor();
        }
    }

    async function volverMenuRoles() {
        await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hoja: "config", action: "updateEmisor", emisor: "" }) });
        
        document.getElementById("seccionEmisor").classList.add("oculto");
        document.getElementById("seccionReceptor").classList.add("oculto");
        document.getElementById("seccionRol").classList.remove("oculto");
    }

    async function cerrarSesion() {
        await volverMenuRoles();
        usuarioActual = "";
        document.getElementById("loginPass").value = "";
        document.getElementById("mensajeLogin").innerText = "";
        document.getElementById("seccionRol").classList.add("oculto");
        document.getElementById("seccionLogin").classList.remove("oculto");
    }

    async function guardarExpediente() {
        const nro = document.getElementById("nroExp").value;
        const loc = document.getElementById("localidad").value;
        const receptor = document.getElementById("agenteReceptorAsignado").value;
        const caratula = document.getElementById("caratula").value;
        const fechaCreacion = document.getElementById("fechaCreacionExp").value;
        const fechaEntrega = document.getElementById("fechaEntregaExp").value;
        const msg = document.getElementById("mensajeEmisor");

        if(!nro) { msg.style.color = "red"; msg.innerText = "⚠️ El número de expediente es obligatorio."; return; }

        let nuevaFila = [Math.floor(Math.random() * 100000), nro, "General", loc, receptor, caratula, fechaCreacion, fechaEntrega, usuarioActual, "sin recibir", "", ""];

        msg.style.color = "#333"; msg.innerText = "Guardando...";
        await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hoja: "movimientos", action: "append", valores: nuevaFila }) });
        
        msg.style.color = "green"; msg.innerText = "✅ ¡Expediente guardado con éxito!";
        document.getElementById("nroExp").value = "";
        document.getElementById("caratula").value = "";
        establecerFechasPorDefecto();
    }

    async function cargarExpedientesReceptor() {
        const contenedor = document.getElementById("listaExpedientesReceptor");
        contenedor.innerHTML = "Buscando expedientes...";

        let respuesta = await fetch(URL_API + "?action=getMovimientos");
        let filas = await respuesta.json();

        let html = "";
        let encontrados = false;

        for (let i = 1; i < filas.length; i++) {
            let f = filas[i];
            let id = f[0];
            let nroExp = f.length > 1 ? f[1] : "";
            let localidad = f.length > 3 ? f[3] : "";
            let agenteReceptor = f.length > 4 ? String(f[4]).trim().toLowerCase() : "";
            let caratula = f.length > 5 ? f[5] : "";
            let fechaCreacion = f.length > 6 ? f[6] : "";
            let fechaEntrega = f.length > 7 ? f[7] : "";
            let estado = f.length > 9 ? String(f[9]).trim().toLowerCase() : "";

            if (agenteReceptor === usuarioActual.toLowerCase() && estado === "sin recibir") {
                encontrados = true;
                html += `
                    <div class="card">
                        <b>Nro Exp:</b> ${nroExp} <br>
                        <b>Localidad:</b> ${localidad} <br>
                        <b>Carátula:</b> ${caratula} <br>
                        <b>Fecha Creación:</b> ${fechaCreacion} <br>
                        <b>Fecha Entrega:</b> ${fechaEntrega} <br><br>
                        <button onclick="marcarRecibido('${id}')" class="btn-success">📥 Marcar Recibido</button>
                    </div>
                `;
            }
        }

        if (!encontrados) {
            contenedor.innerHTML = "<p>🎉 ¡No tenés expedientes pendientes de recepción!</p>";
        } else {
            contenedor.innerHTML = html;
        }
    }

    async function marcarRecibido(idExp) {
        await fetch(URL_API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hoja: "movimientos", action: "marcarRecibido", id: idExp }) });
        alert("¡Expediente marcado como recibido!");
        cargarExpedientesReceptor();
    }
</script>

</body>
</html>
